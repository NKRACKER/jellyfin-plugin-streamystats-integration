map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream jellyfin12 {
    server jellyfin:8096;
    keepalive 32;
}

upstream streamystats_app {
    server streamystats:3000;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name media.example.com;

    # ssl_certificate /etc/letsencrypt/live/media.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/media.example.com/privkey.pem;

    location / {
        proxy_pass http://jellyfin12;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl http2;
    server_name stats.media.example.com;

    # ssl_certificate /etc/letsencrypt/live/stats.media.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/stats.media.example.com/privkey.pem;

    # Fail-closed user-switch guard. It clears only Streamystats' own cookies.
    # The exact CORS origin lets Jellyfin verify completion before loading the app.
    location = /__jellyfin_integration_reset {
        if ($request_method != POST) { return 405; }
        if ($http_origin = "https://media.example.com") { return 418; }
        return 403;
    }
    error_page 418 = @ssi_reset_allowed;
    location @ssi_reset_allowed {
        internal;
        add_header Set-Cookie "streamystats-session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
        add_header Set-Cookie "streamystats-token=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
        add_header Access-Control-Allow-Origin "https://media.example.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "X-SSI-Session-Reset" always;
        add_header Vary "Origin" always;
        add_header X-SSI-Session-Reset "1" always;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    location / {
        proxy_pass http://streamystats_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streamystats 2.18.1 sends DENY. Remove it only here and allow only
        # the concrete Jellyfin origin. Do not use frame-ancestors *.
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-ancestors 'self' https://media.example.com" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
