# Add this only to the Streamystats Proxy Host's "Advanced" field.
# Replace the origin before saving. Without it, the plugin simply opens Streamystats in a new tab.
proxy_hide_header X-Frame-Options;
add_header Content-Security-Policy "frame-ancestors 'self' https://media.example.com" always;

# NPM configures proxy_pass, TLS and WebSocket support in its UI.
# Do not paste this into the Jellyfin Proxy Host.
