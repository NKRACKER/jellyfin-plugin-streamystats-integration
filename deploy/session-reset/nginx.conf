server {
    listen 8080;
    server_name _;

    location = /__jellyfin_integration_reset {
        if ($request_method != POST) { return 405; }
        if ($http_origin = "https://media.example.com") { return 418; }
        return 403;
    }
    error_page 418 = @ssi_reset_allowed;
    location @ssi_reset_allowed {
        internal;
        add_header Set-Cookie "streamystats-session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
        add_header Set-Cookie "streamystats-token=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
        add_header Access-Control-Allow-Origin "https://media.example.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "X-SSI-Session-Reset" always;
        add_header Vary "Origin" always;
        add_header X-SSI-Session-Reset "1" always;
        add_header Cache-Control "no-store" always;
        return 204;
    }
}
