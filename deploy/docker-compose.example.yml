services:
  jellyfin:
    image: jellyfin/jellyfin:12.0
    container_name: jellyfin
    volumes:
      - ./jellyfin-config:/config
      - ./media:/media:ro
    expose:
      - "8096"
    restart: unless-stopped

  # Illustrative frontend service only. Keep the remaining database/job-server
  # services from Streamystats' official, version-matched compose file.
  streamystats:
    image: ghcr.io/fredrikburmester/streamystats-nextjs:2.18.1
    container_name: streamystats
    env_file:
      - path: .env.streamystats
        required: false
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - jellyfin
      - streamystats
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
